/* ═══════════════════ BINARY ENGINE ═══════════════════ */
const RS=320,MR=1000,NO=65,NL=100,CO=319;
function parseRec(i,d){const v=new DataView(d.buffer,d.byteOffset,d.byteLength);const cn=v.getUint16(0,true);let nm="";try{nm=new TextDecoder("utf-16le").decode(d.slice(NO,NO+NL)).split("\x00")[0]}catch{}return{index:i,raw:new Uint8Array(d),chNum:cn,name:nm,isActive:cn!==0&&cn!==0xFFFF&&nm.length>0}}
function updRec(r,nn,nm){const raw=new Uint8Array(r.raw),v=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);const n=parseInt(nn,10);v.setUint16(0,n,true);const u=new Uint8Array(NL).fill(0);const s=String(nm);for(let i=0;i<s.length&&i*2<NL;i++){const c=s.charCodeAt(i);u[i*2]=c&0xFF;u[i*2+1]=(c>>8)&0xFF}raw.set(u,NO);let sm=0;for(let i=0;i<CO;i++)sm+=raw[i];raw[CO]=sm%256;return{...r,raw,chNum:n,name:s,isActive:true}}
function delRec(r){const raw=new Uint8Array(r.raw),v=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);v.setUint16(0,0,true);raw.fill(0,NO,NO+NL);let sm=0;for(let i=0;i<CO;i++)sm+=raw[i];raw[CO]=sm%256;return{...r,raw,chNum:0,name:"",isActive:false}}
function recsBlob(recs){const b=new Uint8Array(recs.length*RS);recs.forEach((r,i)=>b.set(r.raw,i*RS));return new Blob([b],{type:"application/octet-stream"})}
function expCSV(recs){const a=recs.filter(r=>r.isActive).sort((a,b)=>a.chNum-b.chNum);let c="Index (DO NOT EDIT),Channel Number,Channel Name\n";a.forEach(r=>{c+=`${r.index},${r.chNum},"${r.name.replace(/"/g,'""')}"\n`});return c}
function impCSV(t){const ls=t.split(/\r?\n/).filter(l=>l.trim());if(!ls[0]?.includes("Index (DO NOT EDIT)"))return null;const rows=[];for(let i=1;i<ls.length;i++){const ps=[];let cur="",inQ=false;for(const ch of ls[i]){if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){ps.push(cur);cur=""}else cur+=ch}ps.push(cur);if(ps.length>=3){const idx=parseInt(ps[0],10),num=parseInt(ps[1],10);if(!isNaN(idx)&&!isNaN(num))rows.push({idx,num,name:ps[2]})}}return rows}

/* ═══════════════════ HARDWARE DETECTION — matches Python tool ═══════════════════ */
function parsePCI(d){try{const t=new TextDecoder("utf-8",{fatal:false}).decode(d.slice(4));return{model:t.includes("#")?t.split("#")[1]?.split("%")[0]||null:null,fw:t.includes("@")?t.split("@")[0]:null}}catch{return{}}}
function parseFADAT(d){
  let ft="";for(let i=0;i<d.length;i++){const b=d[i];ft+=(b>=32&&b<=126)?String.fromCharCode(b):" "}
  const fw=(ft.match(/T-[A-Z0-9]+/)||[])[0]||null;
  const panel=(ft.match(/\b(\d{2}[A-Z]\d[A-Z0-9]*)\b/)||[])[1]||null;
  const model=(ft.match(/\b(H[A-Z]\d{3})\b/)||[])[0]||null;
  let displaySize=null,series=null,panelRev=null;
  if(panel){displaySize=panel.slice(0,2);series=panel.slice(2,4);panelRev=panel.slice(4)||null}
  return{fw,panel,model,displaySize,series,panelRev};
}
function mergeHW(base,pci,fad){
  const hw={...base};
  if(pci?.model)hw.model=pci.model;
  if(pci?.fw)hw.fw=pci.fw;
  if(fad?.fw&&!hw.fw)hw.fw=fad.fw;
  if(fad?.panel)hw.panel=fad.panel;
  if(fad?.model&&!hw.model)hw.model=fad.model;
  if(fad?.displaySize)hw.displaySize=fad.displaySize;
  if(fad?.series)hw.series=fad.series;
  if(fad?.panelRev)hw.panelRev=fad.panelRev;
  return hw;
}

/* ═══════════════════ MODAL ═══════════════════ */
function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(<div onClick={onClose} style={{position:"fixed",inset:0,zIndex:200,background:"var(--modal-bg)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"var(--modal-card)",border:"1px solid var(--border2)",borderRadius:8,width:"100%",maxWidth:480,maxHeight:"80vh",display:"flex",flexDirection:"column",animation:"modalIn .2s ease",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}}>
      <div style={{padding:"14px 18px",borderBottom:"1px solid var(--border2)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontWeight:700,fontSize:14,color:"var(--text2)"}}>{title}</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text4)",cursor:"pointer",fontSize:18,lineHeight:1,padding:"2px 6px"}}>✕</button>
      </div>
      <div style={{padding:"16px 18px",overflowY:"auto",flex:1}}>{children}</div>
    </div>
  </div>);
}

/* ═══════════════════ HW INFO PANEL — matches Python layout ═══════════════════ */
function HWPanel({hw,L}){
  if(!hw)return null;
  const Row=({label,val})=>val?<div style={{display:"flex",justifyContent:"space-between",padding:"3px 0"}}><span style={{color:"var(--text5)",fontSize:10}}>{label}</span><span style={{color:"var(--text2)",fontSize:11,fontWeight:600}}>{val}</span></div>:null;
  return(
    <div style={{background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,padding:"10px 14px",minWidth:220,animation:"slideUp .3s ease"}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,color:"var(--accent)"}}><TvIcon/><span style={{fontSize:11,fontWeight:700,letterSpacing:1}}>TV HARDWARE</span></div>
      <Row label={L("mod")} val={hw.model}/>
      <Row label={L("fw")} val={hw.fw}/>
      <Row label={L("pan")} val={hw.panel}/>
      {hw.displaySize&&<div style={{borderTop:"1px solid var(--border2)",marginTop:5,paddingTop:5}}>
        <Row label={L("disp")} val={hw.displaySize+'" ('+hw.series+' Series)'}/>
        {hw.panelRev&&<Row label={L("rev")} val={hw.panelRev}/>}
      </div>}
    </div>
  );
}

/* ═══════════════════ MAIN APP ═══════════════════ */
function App(){
  const[theme,setTheme]=useState(()=>localStorage.getItem("se_theme")||"dark");
  const[lang,setLang]=useState(()=>localStorage.getItem("se_lang")||"en");
  const[recs,setRecs]=useState([]);
  const[origBlob,setOrigBlob]=useState(null);
  const[fName,setFName]=useState("");
  const[search,setSearch]=useState("");
  const[sKey,setSKey]=useState("num");
  const[sAsc,setSAsc]=useState(true);
  const[sel,setSel]=useState(new Set());
  const[hw,setHw]=useState(null);
  const[toast,setToast]=useState(null);
  const[drag,setDrag]=useState(false);
  const[langO,setLangO]=useState(false);
  const[helpO,setHelpO]=useState(false);
  const[dirty,setDirty]=useState(false);
  const[editM,setEditM]=useState(null);
  const[confM,setConfM]=useState(null);
  const[helpM,setHelpM]=useState(null);
  const[csvM,setCsvM]=useState(false);
  const[ctx,setCtx]=useState(null);
  const fRef=useRef(),cRef=useRef(),aRef=useRef(),lRef=useRef(),hRef=useRef();

  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("se_theme",theme)},[theme]);
  useEffect(()=>{document.documentElement.setAttribute("dir",L_DATA[lang]?.dir||"ltr");localStorage.setItem("se_lang",lang)},[lang]);
  useEffect(()=>{const c=e=>{if(lRef.current&&!lRef.current.contains(e.target))setLangO(false);if(hRef.current&&!hRef.current.contains(e.target))setHelpO(false);setCtx(null)};document.addEventListener("mousedown",c);return()=>document.removeEventListener("mousedown",c)},[]);

  const $=useCallback((k,...a)=>T(lang,k,...a),[lang]);
  const toast$=useCallback((m,t="info")=>{setToast({m,t});setTimeout(()=>setToast(null),4000)},[]);
  const dl=(b,n)=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href)};
  const isRTL=L_DATA[lang]?.dir==="rtl";

  // LOAD MAP
  const loadMap=useCallback(file=>{
    if(!file)return;setFName(file.name);
    const r=new FileReader();
    r.onload=e=>{const buf=new Uint8Array(e.target.result);setOrigBlob(new Blob([buf],{type:"application/octet-stream"}));
      const rc=[];for(let i=0;i<MR;i++){const o=i*RS;if(o+RS>buf.length)break;rc.push(parseRec(i,buf.slice(o,o+RS)))}
      setRecs(rc);setSel(new Set());setDirty(false);
      toast$($("tLoad",rc.filter(x=>x.isActive).length,file.name),"success");
    };r.readAsArrayBuffer(file);
  },[toast$,$]);

  // DROP — file or folder
  const onDrop=useCallback(e=>{
    e.preventDefault();setDrag(false);
    const items=e.dataTransfer.items;
    if(items?.length){
      const entries=[];for(let i=0;i<items.length;i++){const en=items[i].webkitGetAsEntry?.();if(en)entries.push(en)}
      if(entries.length===1&&entries[0].isDirectory){
        const dr=entries[0].createReader();
        dr.readEntries(fes=>{
          let mapEntry=null,hwData={};let pending=fes.length;
          const done=()=>{if(--pending<=0){if(mapEntry)mapEntry.file(f=>loadMap(f));if(Object.keys(hwData).length)setHw(hwData);toast$($("tFolder"),"success")}};
          fes.forEach(fe=>{if(!fe.isFile){done();return}
            if(fe.name.startsWith("map-AirD")||(!mapEntry&&(fe.name.startsWith("map-AirA")||fe.name.startsWith("map-CableA")))){mapEntry=fe;done()}
            else if(fe.name==="ProductCloneInfo"){fe.file(f=>{const r=new FileReader();r.onload=ev=>{hwData=mergeHW(hwData,parsePCI(new Uint8Array(ev.target.result)),null);setHw({...hwData});done()};r.readAsArrayBuffer(f)})}
            else if(fe.name==="FADAT"){fe.file(f=>{const r=new FileReader();r.onload=ev=>{hwData=mergeHW(hwData,null,parseFADAT(new Uint8Array(ev.target.result)));setHw({...hwData});done()};r.readAsArrayBuffer(f)})}
            else done()});
        });return;
      }
    }
    const f=e.dataTransfer.files[0];if(f)loadMap(f);
  },[loadMap,toast$,$]);

  // AUX FILES
  const loadAux=useCallback(files=>{
    let hwD={};
    Array.from(files).forEach(f=>{const r=new FileReader();r.onload=e=>{const d=new Uint8Array(e.target.result);
      if(f.name==="ProductCloneInfo")hwD=mergeHW(hwD,parsePCI(d),null);
      else if(f.name==="FADAT")hwD=mergeHW(hwD,null,parseFADAT(d));
      setHw({...hwD})};r.readAsArrayBuffer(f)});
  },[]);

  // SAVE / BACKUP
  const doSave=useCallback(()=>{if(!recs.length)return;dl(recsBlob(recs),fName||"map-AirD");toast$($("tSave"),"success");setDirty(false)},[recs,fName,toast$,$]);
  const doBak=useCallback(()=>{if(!origBlob)return;const ts=new Date().toISOString().replace(/[:.]/g,"").slice(0,15);dl(origBlob,(fName||"map-AirD")+"_"+ts+".bak");toast$($("tBak"),"info")},[origBlob,fName,toast$,$]);

  // CSV
  const doExpCsv=useCallback(()=>{setCsvM(false);dl(new Blob([expCSV(recs)],{type:"text/csv"}),(fName||"channels")+".csv");toast$($("tCsvO"),"info")},[recs,fName,toast$,$]);
  const doImpCsv=useCallback(f=>{if(!f||!recs.length){toast$($("tFirst"),"error");return}
    const r=new FileReader();r.onload=e=>{const rows=impCSV(e.target.result);if(!rows){toast$($("tCsvB"),"error");return}
      let u=0;const nr=[...recs];rows.forEach(({idx,num,name})=>{if(idx>=0&&idx<nr.length){nr[idx]=updRec(nr[idx],num,name);u++}});
      setRecs(nr);setDirty(true);toast$($("tCsvI",u),"success")};r.readAsText(f);
  },[recs,toast$,$]);

  // EDIT
  const openEd=useCallback(rec=>{setEditM({rec,num:String(rec.chNum),name:rec.name})},[]);
  const doEd=useCallback(()=>{if(!editM)return;const n=parseInt(editM.num,10);if(isNaN(n)){toast$($("tNum"),"error");return}
    if(recs.some(r=>r.isActive&&r.index!==editM.rec.index&&r.chNum===n))toast$($("tDup",n),"warn");
    const nr=[...recs];nr[editM.rec.index]=updRec(nr[editM.rec.index],n,editM.name);setRecs(nr);setEditM(null);setDirty(true);toast$($("tUpd"),"success");
  },[editM,recs,toast$,$]);

  // DELETE
  const reqDel=useCallback(indices=>{const s=indices instanceof Set?indices:new Set([indices]);if(!s.size)return;
    setConfM({count:s.size,fn:()=>{const nr=[...recs];s.forEach(i=>{nr[i]=delRec(nr[i])});setRecs(nr);setDirty(true);toast$($("tDelN",s.size),"info");setSel(new Set());setConfM(null)}});
  },[recs,toast$,$]);

  // SELECT / SORT
  const togSel=useCallback(i=>{setSel(p=>{const s=new Set(p);s.has(i)?s.delete(i):s.add(i);return s})},[]);
  const togSort=useCallback(k=>{if(sKey===k)setSAsc(p=>!p);else{setSKey(k);setSAsc(true)}},[sKey]);

  // FILTERED + SORTED
  const active=useMemo(()=>{let l=recs.filter(r=>r.isActive);if(search){const q=search.toLowerCase();l=l.filter(r=>r.name.toLowerCase().includes(q)||String(r.chNum).includes(q))}l.sort((a,b)=>{let c=sKey==="num"?a.chNum-b.chNum:a.name.localeCompare(b.name);return sAsc?c:-c});return l},[recs,search,sKey,sAsc]);
  const totAct=recs.filter(r=>r.isActive).length;

  // STYLES
  const btn=(bg,c,bd)=>({background:bg||"var(--btn-bg)",color:c||"var(--text3)",border:`1px solid ${bd||"var(--btn-border)"}`,padding:"7px 14px",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"inherit",fontWeight:500,display:"inline-flex",alignItems:"center",gap:6,lineHeight:1});
  const mbtn=c=>({background:"transparent",border:`1px solid ${c}33`,color:c,width:28,height:28,borderRadius:4,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",padding:0});
  const th={padding:"10px 12px",color:"var(--text4)",fontSize:11,fontWeight:600,textAlign:"center",textTransform:"uppercase",letterSpacing:1};
  const td={padding:"8px 12px"};
  const inp={background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text2)",padding:"8px 12px",borderRadius:4,fontSize:13,fontFamily:"inherit",outline:"none",width:"100%"};
  const dd={display:"block",width:"100%",textAlign:"left",padding:"9px 14px",background:"transparent",color:"var(--text3)",border:"none",cursor:"pointer",fontSize:12,fontFamily:"inherit"};

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"var(--text)",fontFamily:"var(--font)",display:"flex",flexDirection:"column"}}>

      {/* TOAST */}
      {toast&&<div style={{position:"fixed",top:20,right:20,zIndex:300,padding:"12px 20px",borderRadius:6,maxWidth:420,animation:"fadeIn .2s",boxShadow:"0 8px 24px rgba(0,0,0,.2)",fontSize:13,fontFamily:"inherit",direction:"ltr",
        background:toast.t==="success"?"var(--success-bg)":toast.t==="error"?"var(--danger-bg2)":toast.t==="warn"?"var(--warn-bg)":"var(--info-bg)",
        border:`1px solid ${toast.t==="success"?"var(--success)":toast.t==="error"?"var(--danger)":toast.t==="warn"?"var(--warn)":"var(--accent)"}`,
        color:toast.t==="success"?"var(--success-light)":toast.t==="error"?"var(--danger-light)":toast.t==="warn"?"var(--warn-light)":"var(--info-light)"}}>{toast.m}</div>}

      {/* CONTEXT MENU */}
      {ctx&&<div style={{position:"fixed",left:ctx.x,top:ctx.y,zIndex:250,background:"var(--modal-card)",border:"1px solid var(--border2)",borderRadius:6,overflow:"hidden",boxShadow:"0 8px 24px rgba(0,0,0,.3)",minWidth:170,animation:"slideUp .15s"}}>
        <button onClick={()=>{openEd(recs[ctx.i]);setCtx(null)}} style={{...dd,color:"var(--text2)",display:"flex",alignItems:"center",gap:8}}><EditIcon/> {$("ctE")}</button>
        <div style={{height:1,background:"var(--border2)"}}/>
        <button onClick={()=>{reqDel(sel.size?sel:new Set([ctx.i]));setCtx(null)}} style={{...dd,color:"var(--danger)",display:"flex",alignItems:"center",gap:8}}><TrashIcon/> {$("ctD")}</button>
      </div>}

      {/* MODALS */}
      <Modal open={!!editM} onClose={()=>setEditM(null)} title={$("edT")}>
        {editM&&<div>
          <label style={{fontSize:12,color:"var(--text4)",display:"block",marginBottom:4}}>{$("edN")}</label>
          <input value={editM.num} onChange={e=>setEditM(p=>({...p,num:e.target.value}))} style={inp} autoFocus onKeyDown={e=>{if(e.key==="Enter")doEd()}}/>
          <label style={{fontSize:12,color:"var(--text4)",display:"block",marginBottom:4,marginTop:14}}>{$("edNm")}</label>
          <input value={editM.name} onChange={e=>setEditM(p=>({...p,name:e.target.value}))} style={inp} onKeyDown={e=>{if(e.key==="Enter")doEd()}}/>
          <div style={{display:"flex",gap:8,marginTop:20,justifyContent:"flex-end"}}>
            <button onClick={()=>setEditM(null)} style={btn()}>{$("edC")}</button>
            <button onClick={doEd} style={btn("var(--accent3)","#fff","var(--accent2)")}>{$("edS")}</button>
          </div>
        </div>}
      </Modal>
      <Modal open={!!confM} onClose={()=>setConfM(null)} title={$("cdT")}>
        {confM&&<div><p style={{fontSize:13,color:"var(--text2)",lineHeight:1.6}}>{$("cdB",confM.count)}</p>
          <div style={{display:"flex",gap:8,marginTop:20,justifyContent:"flex-end"}}>
            <button onClick={()=>setConfM(null)} style={btn()}>{$("cdN")}</button>
            <button onClick={confM.fn} style={btn("var(--danger-bg)","var(--danger-light)","var(--danger)")}>{$("cdY")}</button>
          </div></div>}
      </Modal>
      <Modal open={!!helpM} onClose={()=>setHelpM(null)} title={helpM?.t}>
        {helpM&&<pre style={{fontSize:12,color:"var(--text2)",lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"inherit",margin:0}}>{helpM.b}</pre>}
      </Modal>
      <Modal open={csvM} onClose={()=>setCsvM(false)} title={$("ciT")}>
        <pre style={{fontSize:12,color:"var(--text2)",lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"inherit",margin:0}}>{$("ciB")}</pre>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}><button onClick={doExpCsv} style={btn("var(--accent3)","#fff","var(--accent2)")}>{$("ciO")}</button></div>
      </Modal>

      {/* HEADER */}
      <div style={{padding:"14px 24px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:recs.length?(dirty?"var(--warn)":"var(--success)"):"var(--text5)",boxShadow:recs.length?`0 0 8px ${dirty?"var(--warn)":"var(--success)"}`:"none"}}/>
          <div>
            <h1 style={{margin:0,fontSize:18,fontWeight:700,color:"var(--text2)",letterSpacing:2,textTransform:"uppercase"}}>{$("title")} <span style={{color:"var(--accent)"}}>{$("ta")}</span></h1>
            <p style={{margin:"2px 0 0",fontSize:10,color:"var(--text5)",letterSpacing:1}}>{$("sub")}</p>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {/* HW INFO PANEL — full details like Python tool */}
          <HWPanel hw={hw} L={$}/>
          {/* HELP */}
          <div ref={hRef} style={{position:"relative"}}>
            <button onClick={()=>setHelpO(p=>!p)} style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text3)",height:32,borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",gap:5,padding:"0 10px",fontSize:12,fontFamily:"inherit"}}><HelpIcon/> {$("helpM")}</button>
            {helpO&&<div style={{position:"absolute",top:"100%",right:0,marginTop:4,background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,overflow:"hidden",zIndex:90,minWidth:190,boxShadow:"0 8px 24px rgba(0,0,0,.3)"}}>
              <button onClick={()=>{setHelpM({t:$("hcT"),b:$("hcB")});setHelpO(false)}} style={dd}>{$("hcT")}</button>
              <div style={{height:1,background:"var(--border2)"}}/>
              <button onClick={()=>{setHelpM({t:$("hmT"),b:$("hmB")});setHelpO(false)}} style={dd}>{$("hmT")}</button>
              <div style={{height:1,background:"var(--border2)"}}/>
              <button onClick={()=>{setHelpM({t:$("haT"),b:$("haB")});setHelpO(false)}} style={dd}>{$("haT")}</button>
            </div>}
          </div>
          {/* THEME */}
          <button onClick={()=>setTheme(p=>p==="dark"?"light":"dark")} style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text3)",width:32,height:32,borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{theme==="dark"?<SunIcon/>:<MoonIcon/>}</button>
          {/* LANG */}
          <div ref={lRef} style={{position:"relative"}}>
            <button onClick={()=>setLangO(p=>!p)} style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text3)",height:32,borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",gap:5,padding:"0 10px",fontSize:12,fontFamily:"inherit"}}><GlobeIcon/> {L_DATA[lang]?.label}</button>
            {langO&&<div style={{position:"absolute",top:"100%",right:0,marginTop:4,background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,overflow:"hidden",zIndex:90,minWidth:150,boxShadow:"0 8px 24px rgba(0,0,0,.3)"}}>
              {Object.entries(L_DATA).map(([k,v])=><button key={k} onClick={()=>{setLang(k);setLangO(false)}} style={{...dd,background:k===lang?"var(--select-bg)":"transparent",color:k===lang?"var(--accent)":"var(--text3)",direction:v.dir}}>{v.label}</button>)}
            </div>}
          </div>
        </div>
      </div>

      {/* MAIN */}
      <div style={{flex:1,display:"flex",flexDirection:"column"}}>
      {!recs.length?(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"60px 24px",gap:18,flex:1}}>
          <div onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={onDrop} onClick={()=>fRef.current?.click()}
            style={{width:"100%",maxWidth:500,padding:"50px 28px",border:`2px dashed ${drag?"var(--accent)":"var(--border2)"}`,borderRadius:10,textAlign:"center",cursor:"pointer",background:drag?"var(--select-bg)":"var(--bg4)",transition:"all .2s"}}>
            <div style={{color:drag?"var(--accent)":"var(--text5)",marginBottom:12}}><UploadIcon/></div>
            <p style={{margin:0,fontSize:14,color:"var(--text3)",fontWeight:600}} dangerouslySetInnerHTML={{__html:$("drop",'<span style="color:var(--accent)">map-AirD</span>')}}/>
            <p style={{margin:"8px 0 0",fontSize:12,color:"var(--text5)"}}>{$("dropSub")}</p>
            <p style={{margin:"12px 0 0",fontSize:11,color:"var(--text6)",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><FolderIcon/> {$("dropFolder")}</p>
          </div>
          <input ref={fRef} type="file" style={{display:"none"}} onChange={e=>loadMap(e.target.files[0])}/>
          <button onClick={()=>aRef.current?.click()} style={{background:"transparent",border:"1px solid var(--border2)",color:"var(--text5)",padding:"7px 14px",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>{$("loadAux")}</button>
          <input ref={aRef} type="file" multiple style={{display:"none"}} onChange={e=>loadAux(e.target.files)}/>
          <div style={{marginTop:24,maxWidth:460,fontSize:12,color:"var(--text6)",lineHeight:2,textAlign:"center"}}>
            <p style={{color:"var(--text5)",fontWeight:600,marginBottom:4}}>{$("howT")}</p>
            <p>{$("h1")}</p><p dangerouslySetInnerHTML={{__html:$("h2",'<code style="color:var(--accent)">map-AirD</code>')}}/>
            <p>{$("h3")}</p><p>{$("h4")}</p>
          </div>
        </div>
      ):(
        <>
          {/* TOOLBAR */}
          <div style={{padding:"8px 24px",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",borderBottom:"1px solid var(--border)",background:"var(--bg2)"}}>
            <button onClick={()=>fRef.current?.click()} style={btn()}>{$("open")}</button>
            <input ref={fRef} type="file" style={{display:"none"}} onChange={e=>loadMap(e.target.files[0])}/>
            <button onClick={doSave} style={btn("var(--accent3)","#fff","var(--accent2)")}><SaveIcon/> {$("save")}</button>
            {origBlob&&<button onClick={doBak} style={btn()}><DlIcon/> {$("backup")}</button>}
            <div style={{width:1,height:24,background:"var(--border2)",margin:"0 4px"}}/>
            <button onClick={()=>recs.length&&setCsvM(true)} style={btn()}>{$("expCsv")}</button>
            <button onClick={()=>cRef.current?.click()} style={btn()}>{$("impCsv")}</button>
            <input ref={cRef} type="file" accept=".csv" style={{display:"none"}} onChange={e=>{doImpCsv(e.target.files[0]);e.target.value=""}}/>
            {sel.size>0&&<><div style={{width:1,height:24,background:"var(--border2)",margin:"0 4px"}}/><button onClick={()=>reqDel(sel)} style={btn("var(--danger-bg)","var(--danger-light)","var(--danger)")}><TrashIcon/> {$("delN",sel.size)}</button></>}
            <div style={{flex:1}}/>
            <div style={{position:"relative"}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={$("search")} style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text2)",padding:"6px 12px 6px 30px",borderRadius:4,fontSize:12,fontFamily:"inherit",width:200,outline:"none"}}/>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text5)" strokeWidth="2" style={{position:"absolute",left:10,top:8}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <span style={{fontSize:11,color:"var(--text5)"}}>{$("chAct",totAct)}</span>
          </div>
          {/* TABLE */}
          <div style={{flex:1,padding:"0 24px 16px",overflowY:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",marginTop:8,fontSize:13}}>
              <thead style={{position:"sticky",top:0,background:"var(--bg)",zIndex:10}}>
                <tr style={{borderBottom:"2px solid var(--border2)"}}>
                  <th style={{...th,width:40}}><input type="checkbox" checked={sel.size>0&&sel.size===active.length} onChange={()=>{const a=recs.filter(r=>r.isActive);sel.size===a.length?setSel(new Set()):setSel(new Set(a.map(r=>r.index)))}}/></th>
                  <th style={{...th,cursor:"pointer",userSelect:"none",width:80}} onClick={()=>togSort("num")}>{$("cCh")} {sKey==="num"?(sAsc?"▲":"▼"):""}</th>
                  <th style={{...th,cursor:"pointer",userSelect:"none",textAlign:isRTL?"right":"left"}} onClick={()=>togSort("name")}>{$("cNm")} {sKey==="name"?(sAsc?"▲":"▼"):""}</th>
                  <th style={{...th,width:100}}>{$("cAct")}</th>
                </tr>
              </thead>
              <tbody>
                {active.map(rec=>(
                  <tr key={rec.index} onDoubleClick={()=>openEd(rec)} onContextMenu={e=>{e.preventDefault();if(!sel.has(rec.index))setSel(new Set([rec.index]));setCtx({x:e.clientX,y:e.clientY,i:rec.index})}}
                    style={{borderBottom:"1px solid var(--border3)",background:sel.has(rec.index)?"var(--select-bg)":"transparent",cursor:"default"}}
                    onMouseEnter={e=>{if(!sel.has(rec.index))e.currentTarget.style.background="var(--hover-bg)"}}
                    onMouseLeave={e=>{if(!sel.has(rec.index))e.currentTarget.style.background="transparent"}}>
                    <td style={{...td,textAlign:"center"}}><input type="checkbox" checked={sel.has(rec.index)} onChange={()=>togSel(rec.index)}/></td>
                    <td style={{...td,textAlign:"center"}}><span style={{color:"var(--accent)",fontWeight:600}}>{rec.chNum}</span></td>
                    <td style={{...td,textAlign:isRTL?"right":"left"}}><span style={{color:"var(--text2)"}}>{rec.name}</span></td>
                    <td style={{...td,textAlign:"center"}}><div style={{display:"flex",gap:5,justifyContent:"center"}}>
                      <button onClick={()=>openEd(rec)} style={mbtn("var(--accent)")}><EditIcon/></button>
                      <button onClick={()=>reqDel(new Set([rec.index]))} style={mbtn("var(--danger)")}><TrashIcon/></button>
                    </div></td>
                  </tr>
                ))}
                {!active.length&&<tr><td colSpan={4} style={{textAlign:"center",padding:40,color:"var(--text6)"}}>{search?$("noM"):$("noA")}</td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}
      </div>

      {/* STATUS BAR */}
      <div style={{padding:"6px 24px",borderTop:"1px solid var(--border)",fontSize:11,color:"var(--text5)",display:"flex",justifyContent:"space-between",background:"var(--bg2)"}}>
        <span>{recs.length?$("sLoad",recs.length,fName,totAct)+(dirty?" • "+$("sEdit"):""):$("sReady")}</span>
        <span style={{color:"var(--text6)"}}>{$("foot")}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
