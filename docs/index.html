/* ============================================================
   BINARY PARSING — identical to Python tool
   ============================================================ */
const RECORD_SIZE=320,MAX_RECORDS=1000,NAME_OFFSET=65,NAME_LENGTH=100,CHECKSUM_OFFSET=319;

function parseRecord(index,data){
  const dv=new DataView(data.buffer,data.byteOffset,data.byteLength);
  const chNum=dv.getUint16(0,true);
  let name="";
  try{name=new TextDecoder("utf-16le").decode(data.slice(NAME_OFFSET,NAME_OFFSET+NAME_LENGTH)).split("\x00")[0]}catch{}
  return{index,raw:new Uint8Array(data),chNum,name,isActive:chNum!==0&&chNum!==0xFFFF&&name.length>0};
}

function updateRecord(rec,newNum,newName){
  const raw=new Uint8Array(rec.raw),dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);
  const num=parseInt(newNum,10);
  dv.setUint16(0,num,true);
  const utf16=new Uint8Array(NAME_LENGTH).fill(0);
  const str=String(newName);
  for(let i=0;i<str.length&&i*2<NAME_LENGTH;i++){const c=str.charCodeAt(i);utf16[i*2]=c&0xFF;utf16[i*2+1]=(c>>8)&0xFF}
  raw.set(utf16,NAME_OFFSET);
  let sum=0;for(let i=0;i<CHECKSUM_OFFSET;i++)sum+=raw[i];
  raw[CHECKSUM_OFFSET]=sum%256;
  return{...rec,raw,chNum:num,name:str,isActive:true};
}

function deleteRecord(rec){
  const raw=new Uint8Array(rec.raw),dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);
  dv.setUint16(0,0,true);raw.fill(0,NAME_OFFSET,NAME_OFFSET+NAME_LENGTH);
  let sum=0;for(let i=0;i<CHECKSUM_OFFSET;i++)sum+=raw[i];
  raw[CHECKSUM_OFFSET]=sum%256;
  return{...rec,raw,chNum:0,name:"",isActive:false};
}

function recordsToBlob(records){
  const buf=new Uint8Array(records.length*RECORD_SIZE);
  records.forEach((r,i)=>buf.set(r.raw,i*RECORD_SIZE));
  return new Blob([buf],{type:"application/octet-stream"});
}

function exportCSV(records){
  const active=records.filter(r=>r.isActive).sort((a,b)=>a.chNum-b.chNum);
  let csv="Index (DO NOT EDIT),Channel Number,Channel Name\n";
  active.forEach(r=>{csv+=`${r.index},${r.chNum},"${r.name.replace(/"/g,'""')}"\n`});
  return csv;
}

function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines[0]?.includes("Index (DO NOT EDIT)"))return null;
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const parts=[];let cur="",inQ=false;
    for(const ch of lines[i]){if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){parts.push(cur);cur=""}else cur+=ch}
    parts.push(cur);
    if(parts.length>=3){const idx=parseInt(parts[0],10),num=parseInt(parts[1],10);if(!isNaN(idx)&&!isNaN(num))rows.push({idx,num,name:parts[2]})}
  }
  return rows;
}

function parseProductCloneInfo(data){
  try{const txt=new TextDecoder("utf-8",{fatal:false}).decode(data.slice(4));
  return{model:txt.includes("#")?txt.split("#")[1]?.split("%")[0]||"Unknown":"Unknown",fw:txt.includes("@")?txt.split("@")[0]:"Unknown"}}catch{return{model:"Unknown",fw:"Unknown"}}
}
function parseFADAT(data){
  let ft="";for(let i=0;i<data.length;i++){const b=data[i];ft+=(b>=32&&b<=126)?String.fromCharCode(b):" "}
  return{fw:(ft.match(/T-[A-Z0-9]+/)||[])[0]||null,panel:(ft.match(/\b(\d{2}[A-Z]\d[A-Z0-9]*)\b/)||[])[1]||null,model:(ft.match(/\b(H[A-Z]\d{3})\b/)||[])[0]||null};
}

const SunIcon=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
const MoonIcon=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>;
const GlobeIcon=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>;
const SearchIcon=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text5)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;

/* ============================================================
   MAIN APP
   ============================================================ */
function App(){
  const[theme,setTheme]=useState(()=>localStorage.getItem("se_theme")||"dark");
  const[lang,setLang]=useState(()=>localStorage.getItem("se_lang")||"en");
  const[records,setRecords]=useState([]);
  const[fileName,setFileName]=useState("");
  const[search,setSearch]=useState("");
  const[sortKey,setSortKey]=useState("num");
  const[sortAsc,setSortAsc]=useState(true);
  const[selected,setSelected]=useState(new Set());
  const[editingIdx,setEditingIdx]=useState(null);
  const[editNum,setEditNum]=useState("");
  const[editName,setEditName]=useState("");
  const[hwInfo,setHwInfo]=useState(null);
  const[toast,setToast]=useState(null);
  const[dragOver,setDragOver]=useState(false);
  const[langOpen,setLangOpen]=useState(false);
  const fileRef=useRef(),csvRef=useRef(),auxRef=useRef(),langRef=useRef();

  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("se_theme",theme)},[theme]);
  useEffect(()=>{document.documentElement.setAttribute("dir",LANGS[lang]?.dir||"ltr");localStorage.setItem("se_lang",lang)},[lang]);
  useEffect(()=>{
    const close=e=>{if(langRef.current&&!langRef.current.contains(e.target))setLangOpen(false)};
    document.addEventListener("mousedown",close);return()=>document.removeEventListener("mousedown",close);
  },[]);

  const T=useCallback((key,...args)=>t(lang,key,...args),[lang]);

  const showToast=useCallback((msg,type="info")=>{setToast({msg,type});setTimeout(()=>setToast(null),3500)},[]);

  const handleMapFile=useCallback(file=>{
    if(!file)return;setFileName(file.name);
    const reader=new FileReader();
    reader.onload=e=>{
      const buf=new Uint8Array(e.target.result),recs=[];
      for(let i=0;i<MAX_RECORDS;i++){const off=i*RECORD_SIZE;if(off+RECORD_SIZE>buf.length)break;recs.push(parseRecord(i,buf.slice(off,off+RECORD_SIZE)))}
      setRecords(recs);setSelected(new Set());setEditingIdx(null);
      showToast(T("toastLoaded",recs.filter(r=>r.isActive).length,file.name),"success");
    };reader.readAsArrayBuffer(file);
  },[showToast,T]);

  const onDrop=useCallback(e=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files[0];if(f)handleMapFile(f)},[handleMapFile]);

  const handleAuxFiles=useCallback(files=>{
    let info={model:"Unknown",fw:"Unknown",panel:"Unknown"};
    Array.from(files).forEach(file=>{const reader=new FileReader();
      reader.onload=e=>{const data=new Uint8Array(e.target.result);
        if(file.name==="ProductCloneInfo"){const p=parseProductCloneInfo(data);info={...info,...p}}
        else if(file.name==="FADAT"){const f=parseFADAT(data);if(f.fw&&info.fw==="Unknown")info.fw=f.fw;if(f.panel)info.panel=f.panel;if(f.model&&info.model==="Unknown")info.model=f.model}
        setHwInfo({...info})};reader.readAsArrayBuffer(file)});
  },[]);

  const handleSave=useCallback(()=>{
    if(!records.length)return;const blob=recordsToBlob(records);
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fileName||"map-AirD";a.click();URL.revokeObjectURL(a.href);
    showToast(T("toastSaved"),"success");
  },[records,fileName,showToast,T]);

  const handleExportCSV=useCallback(()=>{
    if(!records.length)return;const csv=exportCSV(records);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=(fileName||"channels")+".csv";a.click();URL.revokeObjectURL(a.href);
    showToast(T("toastCsvOut"),"info");
  },[records,fileName,showToast,T]);

  const handleImportCSV=useCallback(file=>{
    if(!file||!records.length){showToast(T("toastLoadFirst"),"error");return}
    const reader=new FileReader();
    reader.onload=e=>{const rows=parseCSV(e.target.result);
      if(!rows){showToast(T("toastCsvBad"),"error");return}
      let updated=0;const nr=[...records];
      rows.forEach(({idx,num,name})=>{if(idx>=0&&idx<nr.length){nr[idx]=updateRecord(nr[idx],num,name);updated++}});
      setRecords(nr);showToast(T("toastCsvIn",updated),"success")};
    reader.readAsText(file);
  },[records,showToast,T]);

  const startEdit=useCallback(rec=>{setEditingIdx(rec.index);setEditNum(String(rec.chNum));setEditName(rec.name)},[]);
  const confirmEdit=useCallback(()=>{
    const num=parseInt(editNum,10);if(isNaN(num)){showToast(T("toastNumError"),"error");return}
    const nr=[...records];nr[editingIdx]=updateRecord(nr[editingIdx],num,editName);setRecords(nr);setEditingIdx(null);showToast(T("toastUpdated"),"success");
  },[editingIdx,editNum,editName,records,showToast,T]);

  const handleDelete=useCallback(()=>{
    if(!selected.size)return;const nr=[...records];
    selected.forEach(idx=>{nr[idx]=deleteRecord(nr[idx])});
    setRecords(nr);showToast(T("toastDeletedN",selected.size),"info");setSelected(new Set());
  },[selected,records,showToast,T]);

  const toggleSelect=useCallback(idx=>{setSelected(p=>{const s=new Set(p);s.has(idx)?s.delete(idx):s.add(idx);return s})},[]);
  const toggleSort=useCallback(key=>{if(sortKey===key)setSortAsc(p=>!p);else{setSortKey(key);setSortAsc(true)}},[sortKey]);

  const activeRecords=useMemo(()=>{
    let list=records.filter(r=>r.isActive);
    if(search){const q=search.toLowerCase();list=list.filter(r=>r.name.toLowerCase().includes(q)||String(r.chNum).includes(q))}
    list.sort((a,b)=>{let c=sortKey==="num"?a.chNum-b.chNum:a.name.localeCompare(b.name);return sortAsc?c:-c});
    return list;
  },[records,search,sortKey,sortAsc]);

  const totalActive=records.filter(r=>r.isActive).length;
  const isRTL=LANGS[lang]?.dir==="rtl";

  /* --- STYLES using CSS vars --- */
  const btnS=(bg,color,border)=>({background:bg||"var(--btn-bg)",color:color||"var(--text3)",border:`1px solid ${border||"var(--btn-border)"}`,
    padding:"7px 14px",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"inherit",fontWeight:500,display:"inline-flex",alignItems:"center",gap:6,lineHeight:1,transition:"opacity .15s"});
  const microB=color=>({background:"transparent",border:`1px solid ${color}33`,color,width:28,height:28,borderRadius:4,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",padding:0});

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"var(--text)",fontFamily:"var(--font)",position:"relative",transition:"background .25s, color .25s"}}>

      {/* Toast */}
      {toast&&<div style={{position:"fixed",top:20,[isRTL?"left":"right"]:20,zIndex:100,padding:"12px 20px",borderRadius:4,
        background:toast.type==="success"?"var(--success-bg)":toast.type==="error"?"var(--danger-bg2)":"var(--info-bg)",
        border:`1px solid ${toast.type==="success"?"var(--success)":toast.type==="error"?"var(--danger)":"var(--accent)"}`,
        color:toast.type==="success"?"var(--success-light)":toast.type==="error"?"var(--danger-light)":"var(--info-light)",
        fontSize:13,fontFamily:"inherit",maxWidth:420,animation:"fadeIn .2s ease",direction:"ltr"}}>{toast.msg}</div>}

      {/* Header */}
      <div style={{padding:"20px 28px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:records.length?"var(--success)":"var(--text5)",boxShadow:records.length?"0 0 8px var(--success)":"none",transition:"all .3s"}}/>
          <div>
            <h1 style={{margin:0,fontSize:19,fontWeight:700,color:"var(--text2)",letterSpacing:2,textTransform:"uppercase"}}>
              {T("title")} <span style={{color:"var(--accent)"}}>{T("titleAccent")}</span>
            </h1>
            <p style={{margin:"2px 0 0",fontSize:10,color:"var(--text5)",letterSpacing:1}}>{T("subtitle")}</p>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {/* HW Info */}
          {hwInfo&&<div className="hw-info" style={{fontSize:10,color:"var(--text3)",textAlign:"right",lineHeight:1.6,background:"var(--bg3)",padding:"6px 12px",border:"1px solid var(--border2)",borderRadius:4,marginRight:8}}>
            <span style={{color:"var(--text5)"}}>{T("model")}:</span> <span style={{color:"var(--text2)"}}>{hwInfo.model}</span>&ensp;
            <span style={{color:"var(--text5)"}}>{T("fw")}:</span> <span style={{color:"var(--text2)"}}>{hwInfo.fw}</span>&ensp;
            {hwInfo.panel!=="Unknown"&&<><span style={{color:"var(--text5)"}}>{T("panel")}:</span> <span style={{color:"var(--text2)"}}>{hwInfo.panel}</span></>}
          </div>}

          {/* Theme Toggle */}
          <button onClick={()=>setTheme(p=>p==="dark"?"light":"dark")} title={T("theme")}
            style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text3)",width:34,height:34,borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>
            {theme==="dark"?<SunIcon/>:<MoonIcon/>}
          </button>

          {/* Language Dropdown */}
          <div ref={langRef} style={{position:"relative"}}>
            <button onClick={()=>setLangOpen(p=>!p)} title={T("lang")}
              style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text3)",height:34,borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",gap:6,padding:"0 10px",fontSize:12,fontFamily:"inherit"}}>
              <GlobeIcon/> {LANGS[lang]?.label}
            </button>
            {langOpen&&<div style={{position:"absolute",top:"100%",[isRTL?"left":"right"]:0,marginTop:4,background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,overflow:"hidden",zIndex:90,minWidth:150,boxShadow:"0 8px 24px rgba(0,0,0,.3)"}}>
              {Object.entries(LANGS).map(([k,v])=>(
                <button key={k} onClick={()=>{setLang(k);setLangOpen(false)}}
                  style={{display:"block",width:"100%",textAlign:"left",padding:"9px 14px",background:k===lang?"var(--select-bg)":"transparent",color:k===lang?"var(--accent)":"var(--text3)",border:"none",cursor:"pointer",fontSize:12,fontFamily:"inherit",direction:v.dir}}>
                  {v.label}
                </button>
              ))}
            </div>}
          </div>
        </div>
      </div>

      {/* NO FILE — Drop Zone */}
      {!records.length?(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"70px 28px",gap:20}}>
          <div onDragOver={e=>{e.preventDefault();setDragOver(true)}} onDragLeave={()=>setDragOver(false)} onDrop={onDrop}
            onClick={()=>fileRef.current?.click()}
            style={{width:"100%",maxWidth:500,padding:"56px 28px",border:`2px dashed ${dragOver?"var(--accent)":"var(--border2)"}`,borderRadius:10,textAlign:"center",cursor:"pointer",
              background:dragOver?"var(--select-bg)":"var(--bg4)",transition:"all .2s"}}>
            <div style={{color:dragOver?"var(--accent)":"var(--text5)",marginBottom:14}}><UploadIcon/></div>
            <p style={{margin:0,fontSize:14,color:"var(--text3)",fontWeight:600}} dangerouslySetInnerHTML={{__html:T("dropTitle",'<span style="color:var(--accent)">map-AirD</span>')}}/>
            <p style={{margin:"8px 0 0",fontSize:12,color:"var(--text5)"}}>{T("dropSub")}</p>
          </div>
          <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>handleMapFile(e.target.files[0])}/>
          <button onClick={()=>auxRef.current?.click()} style={{background:"transparent",border:"1px solid var(--border2)",color:"var(--text5)",padding:"8px 16px",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
            {T("loadAux")}
          </button>
          <input ref={auxRef} type="file" multiple style={{display:"none"}} onChange={e=>handleAuxFiles(e.target.files)}/>
          <div style={{marginTop:28,maxWidth:460,fontSize:12,color:"var(--text6)",lineHeight:2,textAlign:"center"}}>
            <p style={{color:"var(--text5)",fontWeight:600,marginBottom:6}}>{T("howTitle")}</p>
            <p>{T("how1")}</p>
            <p dangerouslySetInnerHTML={{__html:T("how2",'<code style="color:var(--accent)">map-AirD</code>')}}/>
            <p>{T("how3")}</p>
            <p>{T("how4")}</p>
          </div>
        </div>
      ):(
        <>
          {/* Toolbar */}
          <div className="toolbar-row" style={{padding:"10px 28px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",borderBottom:"1px solid var(--border)",background:"var(--bg2)"}}>
            <button onClick={()=>fileRef.current?.click()} style={btnS()}>{T("openMap")}</button>
            <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>handleMapFile(e.target.files[0])}/>
            <button onClick={handleSave} style={btnS("var(--accent3)","#fff","var(--accent2)")}><SaveIcon/> {T("saveDownload")}</button>
            <div style={{width:1,height:24,background:"var(--border2)",margin:"0 6px"}}/>
            <button onClick={handleExportCSV} style={btnS()}>{T("exportCsv")}</button>
            <button onClick={()=>csvRef.current?.click()} style={btnS()}>{T("importCsv")}</button>
            <input ref={csvRef} type="file" accept=".csv" style={{display:"none"}} onChange={e=>{handleImportCSV(e.target.files[0]);e.target.value=""}}/>
            {selected.size>0&&<>
              <div style={{width:1,height:24,background:"var(--border2)",margin:"0 6px"}}/>
              <button onClick={handleDelete} style={btnS("var(--danger-bg)","var(--danger-light)","var(--danger-bg)")}><TrashIcon/> {T("deleteN",selected.size)}</button>
            </>}
            <div style={{flex:1}}/>
            <div style={{position:"relative"}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={T("search")}
                style={{background:"var(--bg3)",border:"1px solid var(--border2)",color:"var(--text2)",padding:"6px 12px 6px 30px",borderRadius:4,fontSize:12,fontFamily:"inherit",width:200,outline:"none"}}/>
              <span style={{position:"absolute",left:10,top:8}}><SearchIcon/></span>
            </div>
            <span style={{fontSize:11,color:"var(--text5)"}}>{totalActive>1?T("chsActive",totalActive):T("chActive",totalActive)}</span>
          </div>

          {/* Table */}
          <div style={{padding:"0 28px 28px",overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",marginTop:10,fontSize:13}}>
              <thead>
                <tr style={{borderBottom:"1px solid var(--border2)"}}>
                  <th style={thS}><input type="checkbox" checked={selected.size>0&&selected.size===activeRecords.length} onChange={()=>{
                    const act=records.filter(r=>r.isActive);selected.size===act.length?setSelected(new Set()):setSelected(new Set(act.map(r=>r.index)))
                  }}/></th>
                  <th style={{...thS,cursor:"pointer",userSelect:"none"}} onClick={()=>toggleSort("num")}>{T("colCh")} {sortKey==="num"?(sortAsc?"▲":"▼"):""}</th>
                  <th style={{...thS,cursor:"pointer",userSelect:"none",textAlign:isRTL?"right":"left"}} onClick={()=>toggleSort("name")}>{T("colName")} {sortKey==="name"?(sortAsc?"▲":"▼"):""}</th>
                  <th style={thS}>{T("colActions")}</th>
                </tr>
              </thead>
              <tbody>
                {activeRecords.map(rec=>(
                  <tr key={rec.index} style={{borderBottom:"1px solid var(--border3)",background:selected.has(rec.index)?"var(--select-bg)":"transparent",transition:"background .1s"}}
                    onMouseEnter={e=>{if(!selected.has(rec.index))e.currentTarget.style.background="var(--hover-bg)"}}
                    onMouseLeave={e=>{if(!selected.has(rec.index))e.currentTarget.style.background="transparent"}}>
                    <td style={{...tdS,textAlign:"center",width:40}}><input type="checkbox" checked={selected.has(rec.index)} onChange={()=>toggleSelect(rec.index)}/></td>
                    <td style={{...tdS,textAlign:"center",width:80}}>
                      {editingIdx===rec.index
                        ?<input value={editNum} onChange={e=>setEditNum(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==="Enter")confirmEdit();if(e.key==="Escape")setEditingIdx(null)}} style={inpS}/>
                        :<span style={{color:"var(--accent)",fontWeight:600}}>{rec.chNum}</span>}
                    </td>
                    <td style={{...tdS,textAlign:isRTL?"right":"left"}}>
                      {editingIdx===rec.index
                        ?<input value={editName} onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")confirmEdit();if(e.key==="Escape")setEditingIdx(null)}} style={{...inpS,width:"100%"}}/>
                        :<span style={{color:"var(--text2)"}}>{rec.name}</span>}
                    </td>
                    <td style={{...tdS,textAlign:"center",width:110}}>
                      {editingIdx===rec.index
                        ?<div style={{display:"flex",gap:6,justifyContent:"center"}}>
                          <button onClick={confirmEdit} style={microB("var(--success)")}>✓</button>
                          <button onClick={()=>setEditingIdx(null)} style={microB("var(--text5)")}>✕</button>
                        </div>
                        :<div style={{display:"flex",gap:6,justifyContent:"center"}}>
                          <button onClick={()=>startEdit(rec)} style={microB("var(--accent)")} title="Edit"><EditIcon/></button>
                          <button onClick={()=>{const nr=[...records];nr[rec.index]=deleteRecord(nr[rec.index]);setRecords(nr);selected.delete(rec.index);showToast(T("toastDeleted"),"info")}}
                            style={microB("var(--danger)")} title="Delete"><TrashIcon/></button>
                        </div>}
                    </td>
                  </tr>
                ))}
                {activeRecords.length===0&&<tr><td colSpan={4} style={{textAlign:"center",padding:40,color:"var(--text6)"}}>{search?T("noMatch"):T("noActive")}</td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* Footer */}
      <div style={{padding:"12px 28px",borderTop:"1px solid var(--border)",fontSize:11,color:"var(--text6)",textAlign:"center"}}>{T("footer")}</div>
    </div>
  );
}

const thS={padding:"10px 12px",color:"var(--text4)",fontSize:11,fontWeight:600,textAlign:"center",textTransform:"uppercase",letterSpacing:1};
const tdS={padding:"8px 12px"};
const inpS={background:"var(--bg3)",border:"1px solid var(--accent)",color:"var(--text2)",padding:"4px 8px",borderRadius:3,fontSize:13,fontFamily:"inherit",outline:"none",width:60};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
